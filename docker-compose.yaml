services:
  postgres:
    image: postgres:17-alpine
    container_name: go-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: appdb
      TZ: Asia/Ho_Chi_Minh

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d appdb"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
  redis:
    image: redis:7-alpine
    container_name: redis_cache_pyro
    restart: always
    ports:
      - "6379:6379"
    command: >
      redis-server
      --requirepass redis_password123
      --appendonly yes
    volumes:
      - redis-data-pyro:/data
volumes:
  postgres_data:
  redis-data-pyro:
